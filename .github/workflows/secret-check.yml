# Secret check on every pull request and every push to main.
#
# GitHub's own secret scanning and push protection only cover public repos
# on a personal account, so this keeps a check in place once the repo is
# private. It scans only the new commits (the pull request's, or the push's),
# with gitleaks' default rules plus .gitleaks.toml. Read-only, no secrets
# needed. A finding fails the check with the secret redacted.
name: Secret check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o sums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' sums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz$/gl.tar.gz/' | sha256sum -c -
          tar -xzf gl.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="$RANGE" .
